{% load static %}
{% include "bakery/header.html" %}

<main>
  <div class="form-container" style="margin-top: 40px; margin-bottom: 40px;">
    <h2>Contact Us</h2>
    <form method="post" class="generic-form">
      {% csrf_token %}
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required class="form-control">
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required class="form-control">
      </div>

      <div class="form-group">
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" required class="form-control">
      </div>

      <div class="form-group">
        <label for="message">Message:</label>
        <textarea id="message" name="message" required class="form-control" style="height: 150px;"></textarea>
      </div>

      <button class="btn2" type="submit">Send Message</button>
    </form>
  </div>
</main>

{% include "bakery/footer.html" %}
